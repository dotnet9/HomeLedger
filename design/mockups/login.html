<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HomeLedger · 登录</title>
<link rel="stylesheet" href="shared.css">
<style>
  .login-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(560px 300px at 18% 12%, rgba(20,125,100,.10), transparent 65%),
      radial-gradient(480px 280px at 85% 90%, rgba(217,164,65,.12), transparent 65%);
    position: relative;
  }
  /* 玉璧装饰环 */
  .login-wrap::before {
    content: ""; position: absolute; left: 90px; top: 130px;
    width: 150px; height: 150px; border-radius: 50%;
    border: 14px solid rgba(20,125,100,.07);
  }
  .login-wrap::after {
    content: ""; position: absolute; right: 110px; bottom: 100px;
    width: 90px; height: 90px; border-radius: 50%;
    border: 10px solid rgba(217,164,65,.12);
  }
  .login-card {
    width: 384px; background: #fff; border: 1px solid var(--border);
    border-radius: 20px; padding: 38px 36px 28px;
    box-shadow: 0 16px 50px rgba(30,70,55,.14);
    position: relative; z-index: 1;
  }
  .login-card .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .login-card .logo .icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, #147d64, #3aa08a);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .login-card h1 { font-size: 20px; }
  .login-card .sub { font-size: 13px; color: var(--text-3); margin: 4px 0 26px; }
  .login-card .field { margin-bottom: 16px; }
  .login-card .input { width: 100%; height: 40px; }
  .login-card .btn.primary { width: 100%; height: 40px; font-size: 14px; margin-top: 6px; }
  .alert {
    display: flex; gap: 8px; align-items: flex-start;
    background: #fff7e8; border: 1px solid #ffe1ba; color: var(--warning);
    border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.6;
    margin-bottom: 16px;
  }
  .foot { text-align: center; font-size: 11px; color: var(--text-3); margin-top: 22px; }
  /* 强制改密弹窗 */
  .overlay { position: fixed; }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="logo"><div class="icon">¥</div> HomeLedger 家庭记账</div>
    <div class="spacer"></div>
    <div class="wbtn">—</div><div class="wbtn">▢</div><div class="wbtn close">✕</div>
  </div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo"><div class="icon">¥</div><h1>家庭记账</h1></div>
      <div class="sub">HomeLedger · 记录一家人的收入与支出</div>

      <div class="alert">⚠ 首次登录或被重置密码后，需先设置新密码。</div>

      <div class="field">
        <label>用户名</label>
        <div class="input" style="justify-content:space-between;">zhangnan<span class="muted">✕</span></div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="input" style="justify-content:space-between;">••••••••<span class="muted">👁</span></div>
      </div>
      <div class="btn primary">登 录</div>
      <div class="foot">数据保存在本机 · 家庭内部使用</div>
    </div>
  </div>

  <!-- 场景：首次登录强制改密 -->
  <div class="overlay">
    <div class="modal">
      <div class="m-head">首次登录请修改密码<span class="x">✕</span></div>
      <div class="m-body">
        <div class="field"><label>新密码</label><div class="input" style="width:100%;">••••••••</div></div>
        <div class="field"><label>确认新密码</label><div class="input" style="width:100%;">••••••••</div></div>
      </div>
      <div class="m-foot"><div class="btn primary">确认修改</div></div>
    </div>
  </div>
</body>
</html>
